name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-and-format:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend unit tests and collect coverage
        working-directory: backend
        run: |
          npx vitest run --coverage

      - name: Extract coverage percentage
        working-directory: backend
        run: |
          echo "Reading coverage from ./coverage/coverage-summary.json"
          ls -R backend/coverage || echo "❌ coverage folder not found"
          COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.statements.pct)")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "$COVERAGE" > ../last-coverage.txt


      - name: Upload current coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Upload current coverage value for future comparison
        uses: actions/upload-artifact@v4
        with:
          name: last-coverage
          path: last-coverage.txt

      - name: Download previous coverage artifact (if exists)
        uses: dawidd6/action-download-artifact@v3
        with:
          name: last-coverage
          path: .

      - name: Compare with previous coverage
        run: |
          echo "Current coverage: $COVERAGE%"
          if [ -f last-coverage.txt ]; then
            LAST=$(cat last-coverage.txt)
            echo "Previous coverage: $LAST%"
            COMPARE=$(awk "BEGIN {print ($COVERAGE < $LAST)}")
            if [ "$COMPARE" == "1" ]; then
              echo "❌ Coverage dropped from $LAST% to $COVERAGE%"
              exit 1
            else
              echo "✅ Coverage did not drop."
            fi
          else
            echo "No previous coverage found, skipping comparison."
          fi

      - name: Detect changed TypeScript files
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.ts
            **/*.tsx

      - name: Format changed files with Prettier
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          echo "${{ steps.changes.outputs.all_changed_files }}" > changed_files.txt
          npx prettier --write $(cat changed_files.txt)

      - name: Commit formatting changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-format with Prettier"
            git push
          else
            echo "No formatting changes needed."
