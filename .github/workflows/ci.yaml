name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-and-format:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend unit tests and collect coverage
        working-directory: backend
        run: |
          npx vitest run --coverage

      - name: Extract coverage percentage from coverage-final.json
        working-directory: backend
        run: |
          echo "Calculating total statement coverage from coverage-final.json"
          COVERAGE=$(node -e "
            const data = require('./coverage/coverage-final.json');
            let totalCovered = 0, totalStatements = 0;
            for (const file of Object.values(data)) {
              const s = file.s;
              const covered = Object.values(s).filter(v => v > 0).length;
              const all = Object.values(s).length;
              totalCovered += covered;
              totalStatements += all;
            }
            const percent = totalStatements === 0 ? 0 : (100 * totalCovered / totalStatements);
            console.log(percent.toFixed(2));
          ")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "$COVERAGE" > ../last-coverage.txt

      - name: Upload coverage value
        uses: actions/upload-artifact@v4
        with:
          name: last-coverage
          path: last-coverage.txt

      - name: Download previous coverage
        uses: actions/download-artifact@v4
        with:
          name: last-coverage
          path: .

      - name: Compare with previous coverage
        run: |
          echo "Current coverage: $COVERAGE%"
          if [ -f last-coverage.txt ]; then
            LAST=$(cat last-coverage.txt)
            echo "Previous coverage: $LAST%"
            COMPARE=$(awk "BEGIN {print ($COVERAGE < $LAST)}")
            if [ "$COMPARE" == "1" ]; then
              echo "❌ Coverage dropped from $LAST% to $COVERAGE%"
              exit 1
            else
              echo "✅ Coverage did not drop."
            fi
          else
            echo "No previous coverage found, skipping comparison."
          fi

      - name: Detect changed TypeScript files
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.ts
            **/*.tsx

      - name: Format changed files with Prettier
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          echo "${{ steps.changes.outputs.all_changed_files }}" > changed_files.txt
          npx prettier --write $(cat changed_files.txt)

      - name: Commit formatting changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-format with Prettier"
            git push origin HEAD:refs/heads/${{ github.head_ref }}
          else
            echo "No formatting changes needed."
          fi